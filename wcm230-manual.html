<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кофемашина WCM-230</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --blue:#C6D6E5; --blue-2:#E3ECF5; --blue-3:#F1F6FB; --blue-deep:#6F8DAE;
  --red:#6B0F0A; --red-2:#8C1912; --red-3:#A8261C; --red-soft:#F4DEDA;
  --cream:#EFE2CF; --cream-2:#F8F1E7; --cream-3:#FCF8F2;
  --ink:#2A1714; --muted:#6F5C57; --line:#E2D4C1;
  --nero:#211B1C; --amber:#F2A93B; --amber-2:#FFD27F; --berry:#9E2A4A;
  --radius:22px; --shadow:0 10px 30px -12px rgba(75,20,15,.28);
  --fh:'Unbounded',system-ui,sans-serif; --fb:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--fb);color:var(--ink);background:var(--cream-3);
  background-image:radial-gradient(900px 500px at 100% -10%, var(--blue-2), transparent 60%),radial-gradient(700px 500px at -10% 30%, #F3E7D6, transparent 60%);
  background-attachment:fixed;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.01em;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(252,248,242,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fh);font-weight:600;font-size:15px}
.brand .dot{width:34px;height:34px;border-radius:11px;background:var(--red);display:grid;place-items:center;color:var(--cream);font-size:17px}
.brand small{display:block;font-family:var(--fb);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.02em}
.nav{margin-left:auto;display:flex;gap:6px}
.nav a{text-decoration:none;font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.nav a:hover{background:var(--blue-2)}
.nav a.no{background:var(--red);color:var(--cream)}
.nav a.no:hover{background:var(--red-2)}
.nav a.cur:not(.no){border-color:var(--ink)}

/* ===== DANGER ===== */
.danger{background:var(--red);color:var(--cream-2);border-radius:32px;padding:38px 36px 34px;margin:26px 0 30px;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(107,15,10,.7)}
.danger::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 18px, transparent 18px 36px);pointer-events:none}
.danger > *{position:relative}
.danger .kicker{display:inline-flex;align-items:center;gap:8px;background:var(--cream);color:var(--red);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.danger h1{font-size:clamp(28px,4.6vw,50px);line-height:1.04;margin:16px 0 10px;color:#fff}
.danger .lead{max-width:680px;font-size:17px;color:#F3D9CF;margin:0 0 26px}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.top3 .t{background:var(--cream-2);color:var(--red);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:8px}
.top3 .t .em{font-size:34px;line-height:1;position:relative;width:52px;height:52px;display:grid;place-items:center;background:var(--red-soft);border-radius:16px}
.top3 .t .em::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:4px;background:var(--red-3);border-radius:4px;transform:rotate(-40deg)}
.top3 .t b{font-family:var(--fh);font-weight:600;font-size:17px;line-height:1.25;color:var(--red)}
.top3 .t span{font-size:14px;color:#7B3A33}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.dcard{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px 18px 10px}
.dcard h3{display:flex;align-items:center;gap:10px;font-size:15px;color:#fff;margin-bottom:10px}
.dcard h3 i{font-style:normal;font-size:22px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.dcard ul{list-style:none;margin:0;padding:0}
.dcard li{display:flex;gap:10px;padding:8px 0;border-top:1px dashed rgba(255,255,255,.16);font-size:14.5px;color:#F7E5DC}
.dcard li::before{content:"✕";flex:none;width:20px;height:20px;border-radius:50%;background:var(--cream);color:var(--red);font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.danger .go{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:800;font-size:15px;text-decoration:none;transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.cream{background:var(--cream);color:var(--red)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.red{background:var(--red);color:var(--cream)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:9px 15px;font-size:13.5px}

/* ===== HOME ===== */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:center;padding:34px 0 10px}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--muted);font-size:16.5px;max-width:560px}
.swatches{display:flex;gap:8px;margin-top:14px}
.swatches span{width:30px;height:30px;border-radius:9px;border:1px solid rgba(0,0,0,.06)}
.hero .fig-mini{background:linear-gradient(160deg,var(--blue) 0%,var(--blue-2) 100%);border-radius:30px;padding:16px;box-shadow:var(--shadow)}
.alertbar{display:flex;align-items:center;gap:14px;background:var(--red);color:var(--cream);border-radius:20px;padding:14px 18px;text-decoration:none;margin:18px 0 6px}
.alertbar b{font-family:var(--fh);font-weight:600}
.alertbar span{opacity:.8;font-size:14px}
.alertbar .arr{margin-left:auto;background:var(--cream);color:var(--red);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.sect{margin:34px 0 14px;display:flex;align-items:baseline;gap:12px}
.sect h2{font-size:20px}
.sect span{color:var(--muted);font-size:14px}
.main4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{display:flex;align-items:center;gap:14px;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:0 2px 0 rgba(0,0,0,.02);transition:transform .15s, box-shadow .15s, border-color .15s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--blue-deep)}
.tile .ic{flex:none;width:58px;height:58px;border-radius:17px;background:var(--blue-2);display:grid;place-items:center}
.tile .ic svg{width:46px;height:46px}
.tile b{display:block;font-weight:800;font-size:15.5px;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:3px}
.tile .go{margin-left:auto;font-weight:800;color:var(--red);opacity:.0;transition:opacity .15s}
.tile:hover .go{opacity:1}
.main4 .tile{flex-direction:column;align-items:flex-start;padding:20px;min-height:200px;border:0;color:var(--cream-2)}
.main4 .tile .ic{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.9)}
.main4 .tile .ic svg{width:60px;height:60px}
.main4 .tile b{font-family:var(--fh);font-weight:600;font-size:18px;margin-top:auto;color:inherit}
.main4 .tile small{color:inherit;opacity:.85}
.main4 .tile .num{position:absolute;top:16px;right:18px;font-family:var(--fh);font-size:13px;opacity:.7}
.main4 .tile:nth-child(1){background:var(--red)}
.main4 .tile:nth-child(2){background:#4A2A22}
.main4 .tile:nth-child(3){background:var(--blue);color:var(--ink)}
.main4 .tile:nth-child(4){background:var(--cream);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.grid .tile .ic{background:var(--cream-2)}
.grp-blue .tile .ic{background:var(--blue-2)}
.grp-red .tile .ic{background:var(--red-soft)}

/* ===== SCENARIO ===== */
.crumbs{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.back:hover{border-color:var(--ink)}
.shead{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.shead .ic{flex:none;width:72px;height:72px;border-radius:22px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.shead .ic svg{width:56px;height:56px}
.shead h1{font-size:clamp(24px,3.2vw,34px);line-height:1.1}
.shead p{margin:6px 0 0;color:var(--muted)}
.variants{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.variants a{text-decoration:none;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);display:inline-flex;gap:8px;align-items:center}
.variants a.on{background:var(--red);border-color:var(--red);color:var(--cream)}
.warnbox{display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);border:1.5px solid #E7B9B1;color:#5A100B;border-radius:18px;padding:12px 16px;margin:0 0 16px;font-size:14.5px}
.warnbox b{color:var(--red)}
.warnbox .wi{flex:none;width:26px;height:26px;border-radius:8px;background:var(--red);color:var(--cream);display:grid;place-items:center;font-weight:800}
.intro{margin:0 0 18px}
.splay{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.stage{position:sticky;top:78px;background:linear-gradient(165deg,var(--blue) 0%, var(--blue-2) 70%);border-radius:30px;padding:16px;box-shadow:var(--shadow)}
.stage .vt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 6px 10px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#3E5872}
.stage .vt .cnt{background:#fff;border-radius:999px;padding:4px 10px;color:var(--ink);letter-spacing:0}
.figbox{background:var(--cream-3);border-radius:22px;overflow:hidden;display:grid;place-items:center;min-height:200px}
.figbox svg{display:block;width:100%;height:auto}
.cap{background:#fff;border-radius:18px;margin-top:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.cap .n{flex:none;width:34px;height:34px;border-radius:12px;background:var(--red);color:var(--cream);font-family:var(--fh);font-weight:600;display:grid;place-items:center}
.cap p{margin:0;font-weight:600;font-size:15.5px}
.cap .sub{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:4px}
.ctrl{display:flex;gap:10px;margin-top:12px}
.ctrl button{flex:1;border:0;border-radius:16px;padding:13px;font-weight:800;font-size:15px;background:#fff}
.ctrl button.nx{background:var(--red);color:var(--cream)}
.ctrl button:disabled{opacity:.4;cursor:default}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;transition:border-color .15s, background .15s}
.steps li:hover{border-color:var(--blue-deep)}
.steps li .n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--cream);font-weight:800;display:grid;place-items:center;font-size:14px}
.steps li.on{border-color:var(--red);background:#FFF9F6;box-shadow:0 8px 20px -14px rgba(107,15,10,.6)}
.steps li.on .n{background:var(--red);color:var(--cream)}
.steps li.done .n{background:var(--blue);color:var(--ink)}
.steps li p{margin:3px 0 0;font-size:14.5px}
.steps li .w{display:block;margin-top:6px;font-size:13px;color:var(--red-3);font-weight:700}
.steps li .tp{display:block;margin-top:6px;font-size:13px;color:#3E5872;font-weight:600}
.related{margin:30px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:13.5px}
.chip .ci{width:30px;height:30px;border-radius:50%;background:var(--cream-2);display:grid;place-items:center}
.chip .ci svg{width:24px;height:24px}
.chip:hover{border-color:var(--ink)}
.when{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.when a{text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.when a:hover{border-color:var(--red)}
.when .ic{flex:none;width:44px;height:44px;border-radius:13px;background:var(--cream-2);display:grid;place-items:center}
.when .ic svg{width:34px;height:34px}
.when b{display:block;font-size:14px}
.when small{display:block;font-size:12.5px;color:var(--red-3);font-weight:700}

/* SVG figure styling */
.pn-bg{fill:var(--nero)}
.pn .hit{fill:transparent}
.pn .ico{color:var(--cream)}
.pn text{fill:#E9DCCB;font:700 12.5px var(--fb);letter-spacing:.03em}
.pnsvg .finger{font-size:34px}
.pn{transition:opacity .25s;cursor:help}
.pn.off{opacity:.18}
.pn.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.pn .dash{fill:#5a4f50}
.pn .dash.lv{fill:var(--cream)}
.pn.chase{animation:chase 1.6s infinite}
@keyframes chase{0%,100%{opacity:.18}10%,25%{opacity:1}}
.ring{fill:none;stroke:var(--amber);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}
.ring2{fill:rgba(242,169,59,.18);stroke:var(--amber);stroke-width:2.5}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.35);opacity:0}}
.tag rect{fill:var(--amber)}
.tag text{fill:#2A1714;font:800 12.5px var(--fb)}
.tag.dark rect{fill:var(--red)}
.tag.dark text{fill:var(--cream)}
.finger{font-size:26px;animation:tap 1s ease-in-out infinite}
.finger.hold{animation:none}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-5px)}}
.mv .opt{display:none}
.mv .opt.show{display:inline}
.mv .gone{display:none}
.mv .part{transition:opacity .3s}
.mv .hl > *{stroke:var(--amber)!important;stroke-width:4px}
.mv .hl{filter:drop-shadow(0 0 6px rgba(242,169,59,.95));animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 1px rgba(242,169,59,.3))}}
.mv .dim{opacity:.55}
.fx{display:none}
.fx.show{display:inline}
.stream{stroke-width:5;stroke-linecap:round;stroke-dasharray:6 7;animation:flow .5s linear infinite}
.stream.coffee{stroke:#6B3A22}
.stream.water{stroke:#7FB3E0}
@keyframes flow{to{stroke-dashoffset:-13}}
.puff{fill:#fff;opacity:.85;animation:puff 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.puff:nth-child(2){animation-delay:.5s}.puff:nth-child(3){animation-delay:1s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(0,-60px) scale(1.6);opacity:0}}
.arrowfx{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round}
.spin-cw{animation:spcw 3s linear infinite;transform-origin:230px 200px}
.spin-ccw{animation:spccw 3s linear infinite;transform-origin:230px 200px}
@keyframes spcw{to{transform:rotate(360deg)}}
@keyframes spccw{to{transform:rotate(-360deg)}}
.lbl{font:700 11px var(--fb);fill:var(--muted)}

/* errors page */
.errgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:16px}
.err{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 16px}
.err.hide{display:none}
.err .sym{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:15px}
.err .ii{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--nero)}
.err .ii svg{width:26px;height:26px}
.err .ii.bl{animation:blink 1s steps(2,start) infinite}
.err dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.err dt{color:var(--muted);font-weight:700}
.err dd{margin:0}
.err a.more{display:inline-block;margin-top:10px;font-weight:800;color:var(--red);font-size:13.5px}
.filterinfo{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 18px;margin:16px 0 0;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:12px;padding:5px 8px}
.legend li:hover,.legend li.on{background:#fff}
.legend li .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--red);color:var(--cream);font-weight:800;font-size:12px;display:grid;place-items:center}
.spec{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:18px;overflow:hidden}
.spec td{padding:9px 14px;border-bottom:1px solid var(--line)}
.spec td:first-child{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1.5px solid rgba(0,0,0,.08);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== SERVICE ===== */
.service{margin:40px 0 30px;background:var(--blue);border-radius:34px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.service::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.55), transparent 70%);pointer-events:none}
.svhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:16px;position:relative;z-index:1}
.svhead h2{font-size:24px;display:flex;align-items:center;gap:12px}
.svhead h2 i{font-style:normal;width:46px;height:46px;border-radius:14px;background:var(--red);display:grid;place-items:center;font-size:22px}
.svhead p{margin:0;color:#34506B;font-size:14px;flex-basis:100%}
.svhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.svbody{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;position:relative;z-index:1}
.panelw{background:var(--cream-3);border-radius:24px;padding:16px}
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calnav h3{font-size:18px;text-transform:capitalize}
.calnav .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:16px;display:grid;place-items:center}
.ibtn:hover{border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;padding:2px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.cal .d{min-height:86px;background:#fff;border:1.5px solid transparent;border-radius:14px;padding:5px 5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;transition:border-color .15s}
.cal .d:hover{border-color:var(--blue-deep)}
.cal .d.out{background:transparent;opacity:.45}
.cal .d.today{border-color:var(--red)}
.cal .d.today .dn{background:var(--red);color:var(--cream)}
.cal .d.we .dn{color:var(--red-3)}
.cal .dn{font-weight:800;font-size:12.5px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center}

function panelSVG(){
  let s = `<svg viewBox="0 0 900 290" class="pnsvg" role="img" aria-label="Панель управления кофемашины"><rect x="6" y="6" width="888" height="278" rx="46" class="pn-bg"/><rect x="6" y="6" width="888" height="278" rx="46" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>`;
  for (const [k,p] of Object.entries(PANEL)){
    s += `<g class="pn ${p.kind}" data-k="${k}" transform="translate(${p.x},${p.y})"><title>${p.n}. ${esc(p.name)}</title>`;
    if (p.kind === 'scale'){
      s += `<rect x="-38" y="-14" width="76" height="28" fill="transparent"/>` + [0,1,2].map(i=>`<rect class="dash" data-i="${i}" x="${-31+i*22}" y="-3" width="${i===2?19:15}" height="6" rx="2"/>`).join('');
    } else {
      s += `<circle r="30" class="hit"/><g class="ico">${PICO[k]}</g>`;
      if (p.label){
        const ls = p.label.split('\n');
        s += `<text text-anchor="middle" y="${k==='brewdirty'?30:34}">` + ls.map((l,i)=>`<tspan x="0" dy="${i?13:0}">${esc(l)}</tspan>`).join('') + `</text>`;
      }
    }
    s += `</g>`;
  }
  return s + `<g class="ov"></g></svg>`;
}
function setScales(svg){
  ['scaleP','scaleV'].forEach(k=>{
    const g = svg.querySelector(`[data-k="${k}"]`); if(!g) return;
    g.querySelectorAll('.dash').forEach(d=> d.classList.toggle('lv', +d.dataset.i < LEVEL[k]));
  });
}
const ACT = {tap:'нажмите', hold1:'удерживайте 1 с', hold2:'удерживайте 2 с', both1:'вместе · 1 с', both2:'вместе · 2 с', lit:'горит', blink:'мигает', twice:'нажмите ещё раз'};
function parseHi(h){ const i=h.indexOf(':'); return i<0 ? {k:h, a:null} : {k:h.slice(0,i), a:h.slice(i+1)}; }

function applyPanel(svg, st = {}){
  const lit = st.lit ?? 'all';
  let on = lit==='all' ? PN_BTNS : lit==='none' ? [] : lit==='coffee' ? PN_COFFEE : lit;
  on = new Set([...on, ...(st.on||[])]);
  const blink = new Set(st.blink||[]);
  svg.querySelectorAll('.pn').forEach(g=>{
    const k = g.dataset.k;
    g.classList.remove('off','blink','chase');
    if (st.chase && PN_BTNS.includes(k) && k!=='power'){ g.classList.add('chase'); g.style.animationDelay = (PANEL[k].x/900*1.4).toFixed(2)+'s'; return; }
    g.style.animationDelay='';
    if (blink.has(k)) g.classList.add('blink');
    else if (!on.has(k)) g.classList.add('off');
  });
  setScales(svg);
  const ov = svg.querySelector('.ov'); ov.innerHTML='';
  (st.hi||[]).map(parseHi).forEach(({k,a})=>{
    const p = PANEL[k]; if(!p) return;
    const r = p.kind==='scale' ? null : 31;
    let html = `<g transform="translate(${p.x},${p.y})">`;
    if (r){ html += `<circle r="${r}" class="ring2"/><circle r="${r}" class="ring"/>`; }
    else { html += `<rect x="-42" y="-15" width="84" height="30" rx="10" class="ring2"/><rect x="-42" y="-15" width="84" height="30" rx="10" class="ring"/>`; }
    if (a && /^(tap|hold|both|twice)/.test(a)) html += `<text class="finger ${a.startsWith('tap')||a==='twice'?'':'hold'}" x="8" y="${r?44:34}">👆</text>`;
    html += `</g>`;
    ov.insertAdjacentHTML('beforeend', html);
    if (a){ addTag(ov, ACT[a]||a, p.x, p.y - (r?56:34), 900, a==='lit'||a==='blink'?'dark':'', 18); }
  });
}
function addTag(ov, text, x, y, vbw, cls='', fs=12.5){
  const g = document.createElementNS(NS,'g'); g.setAttribute('class','tag '+cls);
  const rect = document.createElementNS(NS,'rect');
  const t = document.createElementNS(NS,'text'); t.setAttribute('text-anchor','middle'); t.setAttribute('y', (fs*0.36).toFixed(1)); t.style.fontSize = fs+'px'; t.textContent = text;
  g.append(rect,t); ov.appendChild(g);
  let w = 0; try{ w = t.getComputedTextLength(); }catch(e){}
  if (!w) w = text.length*fs*0.56;
  w += fs*1.7; const hh = fs*2.1;
  x = Math.max(w/2+6, Math.min(vbw - w/2 - 6, x));
  y = Math.max(hh/2+4, y);
  rect.setAttribute('x', -w/2); rect.setAttribute('y', -hh/2); rect.setAttribute('width', w); rect.setAttribute('height', hh); rect.setAttribute('rx', hh/2);
  g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
}

function applyMachine(svg, st){
  svg.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  svg.querySelectorAll('.opt').forEach(e=>e.classList.remove('show'));
  svg.querySelectorAll('.fx').forEach(e=>e.classList.remove('show'));
  svg.querySelectorAll('.gone').forEach(e=>e.classList.remove('gone'));
  const ov = svg.querySelector('.ov'); ov.innerHTML='';
  (st.show||[]).forEach(id=> svg.querySelector('#'+id)?.classList.add('show'));
  (st.hide||[]).forEach(id=> svg.querySelector('#'+id)?.classList.add('gone'));
  (st.fx||[]).forEach(id=> svg.querySelector('#fx-'+id)?.classList.add('show'));
  if (st.arrow) svg.querySelector('#arr-'+st.arrow)?.classList.add('show');
  if (st.closed){ svg.querySelector('#doorc')?.classList.add('show'); svg.querySelector('#door')?.classList.add('gone'); }
  const his = (st.hi||[]).map(parseHi);
  his.forEach(({k})=> { const el = svg.querySelector('#'+k); if(el){ el.classList.add('hl'); if(el.classList.contains('opt')) el.classList.add('show'); } });
  his.forEach(({k,a}, i)=>{
    const el = svg.querySelector('#'+k); if(!el) return;
    let b; try{ b = el.getBBox(); }catch(e){ return; }
    if (!b || !b.width) return;
    const txt = a || PART[k] || k;
    let y = b.y - 18; if (i%2===1 || y < 18) y = Math.min(b.y + b.height + 20, 388);
    addTag(ov, txt, b.x + b.width/2, y, 460);
  });
}

const FIGS = {panel:panelSVG, front:frontSVG, side:sideSVG, top:topSVG};
function mountScenario(){
  if (!CUR) return;
  $('#prev').onclick = ()=> go(CUR.i-1);
  $('#next').onclick = ()=> { if (CUR.i < CUR.steps.length-1) go(CUR.i+1); else location.hash = '#home'; };
  $$('#steps li').forEach(li=> li.onclick = ()=> go(+li.dataset.i));
  let sx = null, sy = 0;
  const fig = $('#fig');
  fig.addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  fig.addEventListener('touchend', e=>{ if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5) go(CUR.i + (dx < 0 ? 1 : -1)); }, {passive:true});
  go(0, true);
}
function go(i, first){
  const n = CUR.steps.length; i = Math.max(0, Math.min(n-1, i)); CUR.i = i;
  const st = CUR.steps[i];
  const fig = $('#fig');
  if (fig.dataset.v !== st.v){ fig.innerHTML = FIGS[st.v](); fig.dataset.v = st.v; bindPanelClicks(fig); }
  const svg = fig.querySelector('svg');
  if (st.resetLevels){ LEVEL.scaleP = 2; LEVEL.scaleV = 2; }
  if (st.v === 'panel') applyPanel(svg, st); else applyMachine(svg, st);
  $('#vname').textContent = VIEW_NAME[st.v];
  $('#vcnt').textContent = `шаг ${i+1} из ${n}`;
  $('#capn').textContent = i+1;
  $('#capt').innerHTML = esc(st.t) + (st.w?`<span class="sub" style="color:var(--red-3);font-weight:700">⚠ ${esc(st.w)}</span>`:'') + (st.tip?`<span class="sub">💡 ${esc(st.tip)}</span>`:'');
  $('#prev').disabled = i===0;
  $('#next').textContent = i===n-1 ? 'Готово ✓' : 'Дальше →';
  $$('#steps li').forEach((li,j)=>{ li.classList.toggle('on', j===i); li.classList.toggle('done', j<i); });

}

async function initStore(){

  const sub = coll => db.collection(coll).onSnapshot(snap=>{
    DB[coll] = snap.docs.map(d=>({...d.data(), id:d.id})).sort(byCreated);

function openLogin(){

    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

      $('#cfFileMsg').textContent = code==='too_large' ? 'Фото слишком большое' : code==='quota_or_state' ? 'Место для фото закончилось — удалите старые пачки' : code==='rate_limited' ? 'Слишком часто — попробуйте через минуту' : 'Не удалось загрузить фото — попробуйте ещё раз';
      return;
    }
    DB.coffees = c ? DB.coffees.map(x=> x.id===c.id ? rec : x) : [...(DB.coffees||[]), rec];
    const ok = await put('coffees', rec);
    if (ok && oldImg && rec.img !== oldImg && ASSETS) ASSETS.delete(oldImg).catch(()=>{});
    dlg.close(); drawService(); toast(c ? 'Сохранено' : 'Пачка добавлена');
  };
  dlg.showModal();
}

function loadScript(src){ return new Promise((res, rej)=>{ const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
const toRow = (t, o) => t === 'people' ? {id:o.id, name:o.name, color:o.color, emoji:o.emoji, created:o.created || Date.now()}
  : t === 'events' ? {id:o.id, date:o.date, person_id:o.personId, task:o.task, note:o.note || '', done:!!o.done, created:o.created || Date.now(), by_name:o.byName || null}

const fromRow = (t, r) => t === 'people' ? {id:r.id, name:r.name, color:r.color, emoji:r.emoji, created:+r.created || 0}
  : t === 'events' ? {id:r.id, date:r.date, personId:r.person_id, task:r.task, note:r.note || '', done:!!r.done, created:+r.created || 0, byName:r.by_name}
  : {id:r.id, name:r.name, grind:r.grind, opened:r.opened, note:r.note || '', img:r.img, created:+r.created || 0, byName:r.by_name};
function sbErr(error){
  const m = (error && error.message) || '';
  toast(error && (error.code === '42501' || /row-level security|permission/i.test(m)) ? 'Нет прав: войдите как редактор'
    : error && error.code === '23505' ? 'Такой цвет или эмодзи уже занят другим человеком'
    : 'Не удалось сохранить: ' + (m || 'нет связи с Supabase'));
}
async function sbLoad(t){
  const {data, error} = await SB.from(t).select('*');
  if (error){ console.warn('Supabase', t, error); return false; }
  DB[t] = data.map(r=> fromRow(t, r)).sort(byCreated);
  redrawService(); return true;
}
const sbReloadTimers = {};
function sbReload(t){ clearTimeout(sbReloadTimers[t]); sbReloadTimers[t] = setTimeout(()=> sbLoad(t), 250); }
async function sbPut(t, obj){
  const {error} = await SB.from(t).upsert(toRow(t, obj));
  if (error){ sbErr(error); sbLoad(t); return false; }
  return true;
}
async function sbDel(t, id){

}
async function initSupabase(){
  MODE = 'supabase'; STORE_STATE = 'loading'; AUTH = {ready:false, platformEdit:false, edit:false, local:false, id:null};
  try{ await loadScript(SB_LIB); SB = window.supabase.createClient(SB_CONFIG.url.trim(), SB_CONFIG.anonKey.trim()); }
  catch(e){ STORE_STATE = 'sberror'; redrawService(); return; }
  ASSETS = {
    upload: async blob => {
      const path = `${new Date().getFullYear()}/${uid()}.jpg`;
      const {error} = await SB.storage.from(SB_BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
      if (error) throw {code: /size|large/i.test(error.message) ? 'too_large' : 'upstream_error', message: error.message};
      return {id: path};
    },
    delete: async id => { await SB.storage.from(SB_BUCKET).remove([id]); return {deleted:true}; },
  };
  const ok = await Promise.all(SB_TABLES.map(sbLoad));
  STORE_STATE = ok.every(Boolean) ? 'sblive' : 'sberror';
  SB.channel('wcm230-live').on('postgres_changes', {event:'*', schema:'public'}, payload => { if (SB_TABLES.includes(payload.table)) sbReload(payload.table); }).subscribe();
  const {data:{session}} = await SB.auth.getSession();
  await sbApplySession(session);
  SB.auth.onAuthStateChange((event, sess)=>{
    // not awaiting Supabase calls inside this callback (supabase-js recommendation)
    setTimeout(()=>{ sbApplySession(sess); if (event === 'PASSWORD_RECOVERY') openSbNewPw(true); }, 0);
  });
}

async function put(coll, obj){
  if (MODE === 'supabase') return sbPut(coll, obj);
  if (!STORE){ localSave(); return true; }
  const {id, ...body} = obj;
  try{ await STORE.doc(coll+'/'+id).set(JSON.parse(JSON.stringify(body))); return true; }catch(e){ writeErr(e); return false; }
}
async function del(coll, id){
  if (MODE === 'supabase') return sbDel(coll, id);
  if (!STORE){ localSave(); return true; }
  try{ await STORE.doc(coll+'/'+id).delete(); return true; }catch(e){ writeErr(e); return false; }
}

const normHex = h => { if(!h) return null; h = h.trim(); if (!h.startsWith('#')) h = '#'+h; if (/^#[0-9a-f]{3}$/i.test(h)) h = '#'+[...h.slice(1)].map(c=>c+c).join(''); return /^#[0-9a-f]{6}$/i.test(h) ? h.toUpperCase() : null; };
const person = id => DB.people.find(p=>p.id===id);
const takenColors = except => new Map(DB.people.filter(p=>p.id!==except).map(p=>[normHex(p.color), p]));
const takenEmojis = except => new Map(DB.people.filter(p=>p.id!==except).map(p=>[p.emoji, p]));
function freeColor(except){ const t = takenColors(except); return PASTELS.find(c=>!t.has(c)) || randomPastel(t); }
function randomPastel(t){ for(let i=0;i<200;i++){ const h=Math.floor(Math.random()*360); const c=hslHex(h,70,86); if(!t.has(c)) return c; } return '#EEEEEE'; }
function hslHex(h,s,l){ s/=100;l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function freeEmoji(except){ const t = takenEmojis(except); return EMOJIS.find(e=>!t.has(e)) || null; }

  const el = $('#people');
  if (!DB.people.length){ el.innerHTML = `<span class="empty">Пока никого. Добавьте первого ответственного — кнопкой «＋ Ответственный» или прямо при назначении задачи.</span>`; return; }
  el.innerHTML = DB.people.map(p=>{ const c = DB.events.filter(e=>e.personId===p.id).length; return `<button class="pchip" data-id="${p.id}" style="background:${p.color}" title="${AUTH.edit?'Изменить цвет и эмодзи':esc(p.name)}"><span class="e">${p.emoji}</span>${esc(p.name)}<span class="c">${c}</span></button>`; }).join('');
  $$('#people .pchip').forEach(b=> b.onclick = ()=> AUTH.edit ? openPerson(b.dataset.id) : toast('Только просмотр — менять могут редакторы'));
}
function drawUpcoming(){
  const t = dkey(new Date());
  const list = DB.events.filter(e=>!e.done).sort((a,b)=> a.date.localeCompare(b.date)).slice(0,7);
  const el = $('#upcoming');
  if (!list.length){ el.innerHTML = `<li style="cursor:default"><span class="empty">Нет запланированных задач. Нажмите на дату в календаре.</span></li>`; return; }
  el.innerHTML = list.map(e=>{ const p = person(e.personId)||{color:'#eee',emoji:'❔',name:'?'}; const d = parseKey(e.date); const over = e.date < t; return `<li class="${over?'over':''}" data-k="${e.date}"><span class="dt">${over?'просроч.':''}${over?'<br>':''}${d.getDate()} ${MONTHS_G[d.getMonth()].slice(0,3)}</span><span class="who" style="background:${p.color}">${p.emoji}</span><span><b>${esc(e.task)}</b><small>${esc(p.name)}${e.note?' · '+esc(e.note):''}</small></span></li>`; }).join('');
  $$('#upcoming li[data-k]').forEach(li=> li.onclick = ()=> openDay(li.dataset.k));
}

/* --- shared color/emoji picker --- */
function pickerHTML(prefix, exceptId, color, emoji){
  const tc = takenColors(exceptId), te = takenEmojis(exceptId);
  const sw = PASTELS.map(c=>{ const o = tc.get(c); return `<button type="button" class="sw ${normHex(color)===c?'sel':''}" data-c="${c}" style="background:${c}" ${o?`disabled title="Занят: ${esc(o.name)}"`:`title="${c}"`}>${o?o.emoji:''}</button>`; }).join('');
  const em = EMOJIS.map(e=>{ const o = te.get(e); return `<button type="button" class="em ${emoji===e?'sel':''}" data-e="${e}" ${o?`disabled title="Занят: ${esc(o.name)}"`:''}>${e}</button>`; }).join('');
  return `<div class="field"><label>Пастельный цвет</label><div class="colors" id="${prefix}Colors">${sw}</div>
    <div class="hexrow"><span class="pv" id="${prefix}Pv" style="background:${color}"></span><input class="inp" id="${prefix}Hex" value="${color}" maxlength="7" aria-label="HEX-код цвета" placeholder="#AABBCC"><input type="color" id="${prefix}Native" value="${normHex(color)?.toLowerCase()||'#eeeeee'}" aria-label="Выбрать цвет"></div>
    <div class="msg" id="${prefix}Msg"></div></div>
    <div class="field"><label>Эмодзи</label><div class="emojis" id="${prefix}Emojis">${em}</div><div class="msg" id="${prefix}EMsg"></div></div>`;
}
function bindPicker(prefix, exceptId, state){
  const setColor = (c, from) => {
    const n = normHex(c); const msg = $('#'+prefix+'Msg');
    if (!n){ msg.textContent = 'Введите HEX в формате #AABBCC'; state.colorOk = false; return; }
    const o = takenColors(exceptId).get(n);
    if (o){ msg.textContent = `Этот цвет уже у «${o.name}» — выберите другой`; state.colorOk = false; return; }
    msg.textContent = ''; state.color = n; state.colorOk = true;
    $('#'+prefix+'Pv').style.background = n;
    if (from!=='hex') $('#'+prefix+'Hex').value = n;
    if (from!=='native') $('#'+prefix+'Native').value = n.toLowerCase();
    $$('#'+prefix+'Colors .sw').forEach(b=> b.classList.toggle('sel', b.dataset.c===n));
  };
  $$('#'+prefix+'Colors .sw').forEach(b=> b.onclick = ()=> setColor(b.dataset.c));
  $('#'+prefix+'Hex').oninput = e => setColor(e.target.value, 'hex');
  $('#'+prefix+'Native').oninput = e => setColor(e.target.value, 'native');
  $$('#'+prefix+'Emojis .em').forEach(b=> b.onclick = ()=>{ state.emoji = b.dataset.e; $$('#'+prefix+'Emojis .em').forEach(x=>x.classList.toggle('sel', x===b)); $('#'+prefix+'EMsg').textContent=''; });
  state.colorOk = !!normHex(state.color) && !takenColors(exceptId).has(normHex(state.color));
}
function validName(name, exceptId){
  if (!name.trim()) return 'Введите имя';
  if (DB.people.some(p=>p.id!==exceptId && p.name.trim().toLowerCase()===name.trim().toLowerCase())) return 'Такой человек уже есть — выберите его из списка';
  return '';
}

/* --- person dialog --- */
function openPerson(id){
  if (!AUTH.edit) return;
  const p = id ? person(id) : null;
  const st = {color: p ? p.color : freeColor(null), emoji: p ? p.emoji : freeEmoji(null)};
  const dlg = $('#dlg');
  dlg.innerHTML = `<form class="dlg" method="dialog" id="pf"><button class="x" type="button" data-close aria-label="Закрыть">✕</button>
    <h3>${p?'Ответственный':'Новый ответственный'}</h3><p class="subt">${p?'Цвет и эмодзи можно сменить только на свободные — занятые другими отмечены штриховкой.':'Цвет и эмодзи назначены автоматически из свободных — можно поменять.'}</p>
    <div class="field"><label for="pName">Имя</label><input class="inp" id="pName" value="${esc(p?.name||'')}" placeholder="Например, Аня" autocomplete="off"><div class="msg" id="pNameMsg"></div></div>
    ${pickerHTML('pp', id, st.color, st.emoji)}
    <div class="dfoot">${p?`<button type="button" class="btn line sm" id="pDel" style="margin-right:auto;color:var(--red-3)">Удалить</button>`:''}<button type="button" class="btn line sm" data-close>Отмена</button><button type="submit" class="btn red sm">Сохранить</button></div></form>`;
  bindPicker('pp', id, st);
  bindClose(dlg);
  if (p) $('#pDel').onclick = ()=>{
    const b = $('#pDel'); const evs = DB.events.filter(e=>e.personId===id);
    if (!b.dataset.arm){ b.dataset.arm = '1'; b.textContent = evs.length ? `Удалить вместе с задачами (${evs.length})?` : 'Точно удалить?'; return; }
    DB.people = DB.people.filter(x=>x.id!==id); DB.events = DB.events.filter(e=>e.personId!==id);
    del('people', id); evs.forEach(e=> del('events', e.id));
    dlg.close(); drawService(); toast('Удалено');
  };
  $('#pf').onsubmit = e => {
    e.preventDefault();
    const name = $('#pName').value; const nm = validName(name, id);
    $('#pNameMsg').textContent = nm; if (nm) return;
    if (!st.colorOk){ $('#ppMsg').textContent ||= 'Выберите свободный цвет'; return; }
    if (!st.emoji || takenEmojis(id).has(st.emoji)){ $('#ppEMsg').textContent = 'Выберите свободный эмодзи'; return; }
    let rec;
    if (p){ rec = {...p, name:name.trim(), color:st.color, emoji:st.emoji}; DB.people = DB.people.map(x=> x.id===id ? rec : x); }
    else { rec = {id:uid(), name:name.trim(), color:st.color, emoji:st.emoji, created:Date.now()}; DB.people = [...DB.people, rec]; }
    put('people', rec); dlg.close(); drawService(); toast(p?'Сохранено':'Ответственный добавлен');
  };
  dlg.showModal(); setTimeout(()=>$('#pName').focus(), 30);
}
function bindClose(dlg){ $$('[data-close]', dlg).forEach(b=> b.onclick = ()=> dlg.close()); }

/* --- day dialog --- */
function openDay(k){
  const d = parseKey(k);
  const dlg = $('#dlg');
  const st = {color: freeColor(null), emoji: freeEmoji(null)};
  const draw = () => {
    const ro = !AUTH.edit;
    const ev = DB.events.filter(e=>e.date===k);
    dlg.innerHTML = `<form class="dlg" id="df"><button class="x" type="button" data-close aria-label="Закрыть">✕</button>
      <h3>${d.getDate()} ${MONTHS_G[d.getMonth()]} ${d.getFullYear()}</h3><p class="subt">${WDL[d.getDay()]}</p>
      <div id="dEntries">${ev.length? ev.map(e=>{const p=person(e.personId)||{color:'#eee',emoji:'❔',name:'?'};const sid=TASKMAP[e.task];return `<div class="dentry"><span class="who" style="background:${p.color}">${p.emoji}</span><span class="tx"><b>${esc(e.task)}</b>${esc(p.name)}${e.note?' · '+esc(e.note):''}${sid?` · <a href="#s-${sid}" data-close>схема →</a>`:''}<br>${byHTML(e.by, e.byName)}</span>${ro ? (e.done?'<span class="okb">✓ выполнено</span>':'') : `<input type="checkbox" data-done="${e.id}" ${e.done?'checked':''} title="Выполнено" aria-label="Выполнено"><button type="button" class="del" data-del="${e.id}" title="Удалить" aria-label="Удалить">✕</button>`}</div>`}).join('') : `<p class="empty" style="margin:0 0 6px">На эту дату ничего не назначено.</p>`}</div>
      ${ro ? `<p class="rob">🔒 Только просмотр. Назначать обслуживание могут только редакторы.</p><div class="dfoot"><button type="button" class="btn line sm" data-close>Закрыть</button></div>` : `<h3 style="font-size:15px;margin-top:16px">Назначить обслуживание</h3>
      <div class="field"><label for="dTask">Что сделать</label><select class="inp" id="dTask">${TASKS.map(([t])=>`<option>${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><label for="dWho">Ответственный</label><select class="inp" id="dWho">${DB.people.map(p=>`<option value="${p.id}">${p.emoji} ${esc(p.name)}</option>`).join('')}<option value="__new" ${DB.people.length?'':'selected'}>➕ Новый человек…</option></select></div>
      <div class="newp" id="newBox" ${DB.people.length?'hidden':''}>
        <div class="field" style="margin-top:0"><label for="nName">Имя нового ответственного</label><input class="inp" id="nName" placeholder="Например, Дима" autocomplete="off"><div class="msg" id="nNameMsg"></div></div>
        ${pickerHTML('np', null, st.color, st.emoji)}
      </div>
      <div class="field"><label for="dNote">Комментарий</label><input class="inp" id="dNote" placeholder="необязательно" autocomplete="off"></div>
      <div class="dfoot"><button type="button" class="btn line sm" data-close>Закрыть</button><button type="submit" class="btn red sm">Добавить</button></div>`}</form>`;
    bindClose(dlg); fillNames(dlg);
    if (ro) return;
    bindPicker('np', null, st);
    $('#dWho').onchange = e => { $('#newBox').hidden = e.target.value !== '__new'; };
    $$('[data-done]', dlg).forEach(c=> c.onchange = ()=>{ const e = DB.events.find(x=>x.id===c.dataset.done); if(e){ const rec = {...e, done:c.checked}; DB.events = DB.events.map(x=> x.id===e.id ? rec : x); put('events', rec); drawService(); } });
    $$('[data-del]', dlg).forEach(b=> b.onclick = ()=>{ const did = b.dataset.del; DB.events = DB.events.filter(x=>x.id!==did); del('events', did); drawService(); draw(); });
    $('#df').onsubmit = ev2 => {
      ev2.preventDefault();
      let pid = $('#dWho').value;
      if (pid === '__new'){
        const name = $('#nName').value; const nm = validName(name, null);
        $('#nNameMsg').textContent = nm; if (nm) return;
        if (!st.colorOk){ $('#npMsg').textContent ||= 'Выберите свободный цвет'; return; }
        if (!st.emoji || takenEmojis(null).has(st.emoji)){ $('#npEMsg').textContent = 'Выберите свободный эмодзи'; return; }
        pid = uid(); const np = {id:pid, name:name.trim(), color:st.color, emoji:st.emoji, created:Date.now()}; DB.people = [...DB.people, np]; put('people', np);
        st.color = freeColor(null); st.emoji = freeEmoji(null);
      }
      const ne = {id:uid(), date:k, personId:pid, task:$('#dTask').value, note:$('#dNote').value.trim(), done:false, created:Date.now(), by:AUTH.id||null, byName: LOGIN ? LOGIN.name : null};
      DB.events = [...DB.events, ne]; put('events', ne); drawService(); draw(); toast('Задача добавлена');
    };
  };
  draw();
  if (!dlg.open) dlg.showModal();
}

/* ============================================================
   Router
   ============================================================ */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.startsWith('s-') ? ['s', ...h.slice(2).split('-')] : h.split('/');
  const app = $('#app'); CUR = null;
  let r = parts[0] || 'danger';
  if (r === 'danger') app.innerHTML = renderDanger();
  else if (r === 's') app.innerHTML = renderScenario(parts[1], parts[2]);
  else { app.innerHTML = renderHome(); r = (r==='service' || r==='coffee') ? r : 'home'; }
  document.body.classList.toggle('scen', r==='s');
  $$('.nav a, .tabbar a').forEach(a=> a.classList.toggle('cur', a.dataset.r === (r==='s'?'home':r)));
  if (r === 's'){
    const s = SCI[parts[1]];
    if (s?.special==='errors') mountErrors(); else if (s?.special==='parts') mountParts(); else mountScenario();
    window.scrollTo(0,0);
  } else if (r === 'home' || r === 'service' || r === 'coffee'){
    const hp = $('#heroPanel'); hp.innerHTML = panelSVG(); bindPanelClicks(hp); applyPanel(hp.querySelector('svg'), {lit:'all', hi:['power:tap']});
    mountService();
    if (r === 'service') setTimeout(()=> $('#service').scrollIntoView({behavior:'smooth'}), 30);
    else if (r === 'coffee') setTimeout(()=> $('.coffee').scrollIntoView({behavior:'smooth'}), 30);
    else window.scrollTo(0,0);
  } else window.scrollTo(0,0);
  if ($('#dlg').open) $('#dlg').close();
}
/* version switch: auto by screen, the viewer's choice is remembered in this browser */
const MODE_KEY = 'wcm230-mode';
function setMode(m, save){
  document.body.classList.toggle('mob', m === 'mob');
  $$('.mode button').forEach(b=> { b.classList.toggle('on', b.dataset.m === m); b.setAttribute('aria-pressed', b.dataset.m === m); });
  if (save){ try{ localStorage.setItem(MODE_KEY, m); }catch(e){} toast(m === 'mob' ? 'Мобильная версия' : 'Версия для компьютера'); }
}
(function(){ let m = null; try{ m = localStorage.getItem(MODE_KEY); }catch(e){}
  if (m !== 'mob' && m !== 'desk') m = (window.matchMedia && matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1024px)').matches) ? 'mob' : 'desk';
  setMode(m, false); })();
$$('.mode button').forEach(b=> b.onclick = ()=> setMode(b.dataset.m, true));
window.addEventListener('hashchange', route);
route();
initStore().then(initAuth);
</script>
